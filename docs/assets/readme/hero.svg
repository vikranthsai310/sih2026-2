<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t">
  <title id="t">MediKiosk: your case history, taken by an AI call in your own language</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081328"/>
      <stop offset=".6" stop-color="#11264A"/>
      <stop offset="1" stop-color="#1F3864"/>
    </linearGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="640" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset=".25" stop-color="#FFE3B8"/>
      <stop offset=".5" stop-color="#FFFFFF"/>
      <stop offset=".75" stop-color="#8FF0AE"/>
      <stop offset="1" stop-color="#FF9933"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="640 0" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="screen" cx=".5" cy=".3" r=".9">
      <stop offset="0" stop-color="#2A4E8C"/>
      <stop offset="1" stop-color="#0E1D3A"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#FFFFFF" fill-opacity=".09"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="26 26" dur="5s" repeatCount="indefinite"/>
    </pattern>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="420" rx="26"/></clipPath>
    <clipPath id="type1"><rect x="78" y="212" width="0" height="40"><animate attributeName="width" from="0" to="820" dur="1.8s" begin=".5s" fill="freeze"/></rect></clipPath>
    <clipPath id="type2"><rect x="78" y="250" width="0" height="40"><animate attributeName="width" from="0" to="820" dur="1.8s" begin="2.3s" fill="freeze"/></rect></clipPath>
  </defs>
  <style>
    .glyph{font:700 36px 'Nirmala UI','Noto Sans','Segoe UI',sans-serif;fill:#FFFFFF;opacity:0;animation:float 10s linear infinite}
    @keyframes float{0%{opacity:0;transform:translateY(50px)}15%{opacity:.28}80%{opacity:.28}100%{opacity:0;transform:translateY(-110px)}}
    .over{font:700 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#F0C265}
    .title{font:800 92px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:-1px}
    .sub{font:500 25px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#DCE6F5}
    .pill{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
    @keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
    .ptxt{font:600 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
    .bar{transform-box:fill-box;transform-origin:center;animation:eq 1s ease-in-out infinite}
    @keyframes eq{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}
    .phone{transform-box:fill-box;transform-origin:center;animation:ring 3.2s ease-in-out infinite}
    @keyframes ring{0%,40%,100%{transform:rotate(0)}5%{transform:rotate(-7deg)}10%{transform:rotate(7deg)}15%{transform:rotate(-6deg)}20%{transform:rotate(6deg)}25%{transform:rotate(-3deg)}30%{transform:rotate(0)}}
    .bub{opacity:0;animation:bub 9s infinite}
    @keyframes bub{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}34%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}
    .btxt{font:600 17px 'Nirmala UI','Segoe UI',sans-serif;fill:#1F3864}
    .bsub{font:600 10.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.5px;fill:#6E747C}
    .ph{font:600 9px 'Segoe UI',Arial,sans-serif;fill:#C9D6EA}
    .phb{font:700 12px 'Segoe UI',Arial,sans-serif;fill:#FFFFFF}
    .phg{font:600 10px 'Nirmala UI','Segoe UI',sans-serif;fill:#F0C265}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <!-- aurora blobs -->
    <circle cx="220" cy="90" r="170" fill="#FF9933" opacity=".22" filter="url(#blur)">
      <animate attributeName="cx" values="220;430;220" dur="13s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;170;90" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="360" r="200" fill="#1FB85A" opacity=".2" filter="url(#blur)">
      <animate attributeName="cx" values="980;760;980" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="360;260;360" dur="14s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="40" r="150" fill="#0070C0" opacity=".28" filter="url(#blur)">
      <animate attributeName="cx" values="700;560;700" dur="10s" repeatCount="indefinite"/>
    </circle>
    <rect width="1200" height="420" fill="url(#dots)"/>

    <!-- floating scripts of India -->
    <text class="glyph" x="110" y="120" style="animation-delay:-1s">हि</text>
    <text class="glyph" x="330" y="395" style="animation-delay:-4s">తె</text>
    <text class="glyph" x="540" y="130" style="animation-delay:-7s">த</text>
    <text class="glyph" x="610" y="370" style="animation-delay:-2s">বা</text>
    <text class="glyph" x="820" y="190" style="animation-delay:-5s">म</text>
    <text class="glyph" x="870" y="400" style="animation-delay:-8s">ಕ</text>
    <text class="glyph" x="1130" y="110" style="animation-delay:-3s">മ</text>
    <text class="glyph" x="1160" y="330" style="animation-delay:-6s">ગ</text>
    <text class="glyph" x="40" y="330" style="animation-delay:-9s">ଓ</text>
    <text class="glyph" x="430" y="70" style="animation-delay:-2.5s">ਪ</text>
    <text class="glyph" x="900" y="70" style="animation-delay:-6.5s">A</text>
    <text class="glyph" x="560" y="410" style="animation-delay:-4.5s">ह</text>
    <text class="glyph" x="1110" y="230" style="animation-delay:-1.5s">క</text>
    <text class="glyph" x="650" y="215" style="animation-delay:-7.5s">অ</text>

    <!-- radar rings from the ringing phone -->
    <circle cx="1010" cy="210" r="95" fill="none" stroke="#3ACB6A" stroke-width="2" opacity="0">
      <animate attributeName="r" values="95;230" dur="3s" begin="0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="210" r="95" fill="none" stroke="#FF9933" stroke-width="2" opacity="0">
      <animate attributeName="r" values="95;230" dur="3s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".55;0" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1010" cy="210" r="95" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="95;230" dur="3s" begin="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".4;0" dur="3s" begin="2s" repeatCount="indefinite"/>
    </circle>

    <!-- heartbeat line -->
    <path d="M0 396 H120 l12 -6 l10 12 l12 -34 l14 48 l12 -26 l10 6 H420 l12 -6 l10 12 l12 -34 l14 48 l12 -26 l10 6 H720 l12 -6 l10 12 l12 -34 l14 48 l12 -26 l10 6 H1020 l12 -6 l10 12 l12 -34 l14 48 l12 -26 l10 6 H1200" fill="none" stroke="#3ACB6A" stroke-opacity=".18" stroke-width="2"/>
    <path d="M0 396 H120 l12 -6 l10 12 l12 -34 l14 48 l12 -26 l10 6 H420 l12 -6 l10 12 l12 -34 l14 48 l12 -26 l10 6 H720 l12 -6 l10 12 l12 -34 l14 48 l12 -26 l10 6 H1020 l12 -6 l10 12 l12 -34 l14 48 l12 -26 l10 6 H1200" fill="none" stroke="#6CFF9C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1000" stroke-dasharray="130 870" filter="url(#glow)">
      <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- headline -->
    <text class="over" x="80" y="110">SMART INDIA HACKATHON 2026  ·  PS 26047  ·  AIIA</text>
    <text class="title" x="74" y="198" fill="url(#shine)" filter="url(#glow)">MediKiosk</text>
    <text class="sub" x="80" y="242" clip-path="url(#type1)">Your case history, taken by an AI call,</text>
    <text class="sub" x="80" y="280" clip-path="url(#type2)">in your own language, before you meet the doctor.</text>

    <!-- feature pills -->
    <g class="pill" style="animation-delay:4.3s">
      <rect x="80" y="314" width="176" height="36" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FF9933" stroke-opacity=".8"/>
      <circle cx="100" cy="332" r="5" fill="#FF9933"/>
      <text class="ptxt" x="114" y="337">Any phone, no app</text>
    </g>
    <g class="pill" style="animation-delay:4.45s">
      <rect x="268" y="314" width="190" height="36" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#8FE0A8" stroke-opacity=".8"/>
      <circle cx="288" cy="332" r="5" fill="#8FE0A8"/>
      <text class="ptxt" x="302" y="337">22 Indian languages</text>
    </g>
    <g class="pill" style="animation-delay:4.6s">
      <rect x="470" y="314" width="160" height="36" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#FF6B6B" stroke-opacity=".8"/>
      <circle cx="490" cy="332" r="5" fill="#FF6B6B"/>
      <text class="ptxt" x="504" y="337">Red-flag triage</text>
    </g>
    <g class="pill" style="animation-delay:4.75s">
      <rect x="642" y="314" width="182" height="36" rx="18" fill="#FFFFFF" fill-opacity=".07" stroke="#F0C265" stroke-opacity=".8"/>
      <circle cx="662" cy="332" r="5" fill="#F0C265"/>
      <text class="ptxt" x="676" y="337">Ayurveda + ABDM</text>
    </g>

    <!-- the same question, cycling through languages -->
    <g class="bub" style="animation-delay:0s">
      <rect x="676" y="54" width="244" height="58" rx="16" fill="#FFFFFF"/>
      <path d="M919 76 l18 8 l-18 9 z" fill="#FFFFFF"/>
      <text class="btxt" x="694" y="81">दर्द कब शुरू हुआ?</text>
      <text class="bsub" x="694" y="100">HINDI · WHEN DID THE PAIN START?</text>
    </g>
    <g class="bub" style="animation-delay:3s">
      <rect x="676" y="54" width="244" height="58" rx="16" fill="#FFFFFF"/>
      <path d="M919 76 l18 8 l-18 9 z" fill="#FFFFFF"/>
      <text class="btxt" x="694" y="81" style="font-size:15.5px">నొప్పి ఎప్పుడు మొదలైంది?</text>
      <text class="bsub" x="694" y="100">TELUGU · SAME QUESTION</text>
    </g>
    <g class="bub" style="animation-delay:6s">
      <rect x="676" y="54" width="244" height="58" rx="16" fill="#FFFFFF"/>
      <path d="M919 76 l18 8 l-18 9 z" fill="#FFFFFF"/>
      <text class="btxt" x="694" y="81">When did the pain start?</text>
      <text class="bsub" x="694" y="100">ENGLISH · ANY LANGUAGE, ANY PHONE</text>
    </g>

    <!-- ringing phone -->
    <g transform="translate(935 75)">
      <g class="phone">
        <rect width="150" height="270" rx="26" fill="#0B0F17" stroke="#3A4560" stroke-width="2"/>
        <rect x="7" y="7" width="136" height="256" rx="20" fill="url(#screen)"/>
        <rect x="55" y="14" width="40" height="9" rx="4.5" fill="#0B0F17"/>
        <text class="ph" x="75" y="50" text-anchor="middle">MediKiosk · AI call</text>
        <circle cx="75" cy="98" r="28" fill="#FFFFFF"/>
        <path d="M68 81h14v10h10v14h-10v10h-14v-10h-10v-14h10z" fill="#2E7D32"/>
        <text class="phb" x="75" y="146" text-anchor="middle">AIIA Hospital</text>
        <text class="phb" x="75" y="162" text-anchor="middle">Assistant</text>
        <text class="phg" x="75" y="180" text-anchor="middle">हिन्दी · 02:14</text>
        <rect class="bar" x="33" y="198" width="5" height="14" rx="2.5" fill="#8FE0A8" style="animation-delay:0s"/>
        <rect class="bar" x="43" y="193" width="5" height="24" rx="2.5" fill="#8FE0A8" style="animation-delay:-.3s"/>
        <rect class="bar" x="53" y="189" width="5" height="32" rx="2.5" fill="#8FE0A8" style="animation-delay:-.6s"/>
        <rect class="bar" x="63" y="195" width="5" height="20" rx="2.5" fill="#8FE0A8" style="animation-delay:-.2s"/>
        <rect class="bar" x="73" y="187" width="5" height="36" rx="2.5" fill="#8FE0A8" style="animation-delay:-.8s"/>
        <rect class="bar" x="83" y="192" width="5" height="26" rx="2.5" fill="#8FE0A8" style="animation-delay:-.4s"/>
        <rect class="bar" x="93" y="196" width="5" height="18" rx="2.5" fill="#8FE0A8" style="animation-delay:-.7s"/>
        <rect class="bar" x="103" y="190" width="5" height="30" rx="2.5" fill="#8FE0A8" style="animation-delay:-.1s"/>
        <rect class="bar" x="113" y="197" width="5" height="16" rx="2.5" fill="#8FE0A8" style="animation-delay:-.5s"/>
        <circle cx="75" cy="240" r="13" fill="#E23A3A"/>
        <rect x="67" y="237" width="16" height="6" rx="3" fill="#FFFFFF"/>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="418" rx="25" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
</svg>
