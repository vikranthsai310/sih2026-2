<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t">
  <title id="t">Document AI: old prescriptions and reports are scanned, read and placed on a medical timeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081328"/>
      <stop offset="1" stop-color="#16305A"/>
    </linearGradient>
    <linearGradient id="beamg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CFF9C" stop-opacity="0"/>
      <stop offset="1" stop-color="#6CFF9C" stop-opacity=".35"/>
    </linearGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-150%" width="200%" height="400%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="330" rx="24"/></clipPath>
    <path id="m1" d="M532 206 C 575 206, 600 214, 650 212"/>
    <path id="m2" d="M532 206 C 640 206, 760 214, 860 212"/>
    <path id="m3" d="M532 206 C 700 206, 950 214, 1070 212"/>
  </defs>
  <style>
    .h{font:700 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#F0C265}
    .h2{font:600 24px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
    .paper{opacity:0;transform-box:fill-box;transform-origin:center;animation:fly 8s cubic-bezier(.2,.9,.3,1.1) infinite}
    @keyframes fly{0%{opacity:0;transform:translate(-320px,-50px) rotate(-35deg)}9%{opacity:1;transform:translate(0,0) rotate(0)}90%{opacity:1;transform:translate(0,0) rotate(0)}96%,100%{opacity:0;transform:translate(0,0) rotate(0)}}
    .ptag{font:800 9px 'Segoe UI',Arial,sans-serif;letter-spacing:.6px;fill:#2E5C8A}
    .scan{opacity:0;animation:scan 8s infinite}
    @keyframes scan{0%,20%{opacity:0;transform:translateY(0)}22%{opacity:1;transform:translateY(0)}40%{opacity:1;transform:translateY(158px)}42%,100%{opacity:0;transform:translateY(158px)}}
    .ai{transform-box:fill-box;transform-origin:center;animation:thump 8s ease-in-out infinite}
    @keyframes thump{0%,38%{transform:scale(1)}42%{transform:scale(1.14)}46%,100%{transform:scale(1)}}
    .aitxt{font:800 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:.5px;fill:#0A1630}
    .flow{stroke-dasharray:4 8;animation:flow .8s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-12}}
    .c1,.c2,.c3{opacity:0;transform-box:fill-box;transform-origin:center bottom}
    .c1{animation:c1 8s cubic-bezier(.2,1.5,.4,1) infinite}
    .c2{animation:c2 8s cubic-bezier(.2,1.5,.4,1) infinite}
    .c3{animation:c3 8s cubic-bezier(.2,1.5,.4,1) infinite}
    @keyframes c1{0%,45%{opacity:0;transform:translateY(24px) scale(.6)}50%,94%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(0) scale(1)}}
    @keyframes c2{0%,52%{opacity:0;transform:translateY(24px) scale(.6)}57%,94%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(0) scale(1)}}
    @keyframes c3{0%,59%{opacity:0;transform:translateY(24px) scale(.6)}64%,94%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(0) scale(1)}}
    .ck{font:800 10px 'Segoe UI',Arial,sans-serif;letter-spacing:.8px;fill:#9FB0CC}
    .cv{font:800 18px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
    .cs{font:500 12px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9FB0CC}
    .date{font:800 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#F0C265}
    .blink{animation:blink .7s steps(1) infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:.3}}
    .bt{font:900 10px 'Segoe UI',Arial,sans-serif;letter-spacing:.8px;fill:#FFFFFF}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#dots)"/>
    <text class="h" x="60" y="50">DOCUMENT AI</text>
    <text class="h2" x="60" y="82">Paper in. Timeline out.</text>

    <!-- paper 1: handwritten prescription -->
    <g transform="rotate(-9 190 212)">
      <g class="paper" style="animation-delay:0s">
        <rect x="135" y="142" width="110" height="140" rx="6" fill="#F7F9FC"/>
        <text class="ptag" x="147" y="160">Rx · 2024</text>
        <path d="M147 176 q6 -7 12 0 t12 0 t12 0 t12 0 t12 0 M147 194 q6 -7 12 0 t12 0 t12 0 t12 0 M147 212 q6 -7 12 0 t12 0 t12 0 t12 0 t12 0 t10 0 M147 230 q6 -7 12 0 t12 0 t12 0" fill="none" stroke="#5A6B8C" stroke-width="2" stroke-linecap="round"/>
      </g>
    </g>
    <!-- paper 2: discharge summary -->
    <g transform="rotate(6 190 212)">
      <g class="paper" style="animation-delay:.35s">
        <rect x="135" y="142" width="110" height="140" rx="6" fill="#FFFFFF"/>
        <text class="ptag" x="147" y="160">DISCHARGE</text>
        <rect x="147" y="170" width="86" height="4" rx="2" fill="#C9D3E1"/>
        <rect x="147" y="182" width="70" height="4" rx="2" fill="#C9D3E1"/>
        <rect x="147" y="194" width="80" height="4" rx="2" fill="#C9D3E1"/>
        <rect x="147" y="206" width="60" height="4" rx="2" fill="#C9D3E1"/>
        <rect x="147" y="218" width="84" height="4" rx="2" fill="#C9D3E1"/>
      </g>
    </g>
    <!-- paper 3: lab report (top) -->
    <g>
      <g class="paper" style="animation-delay:.7s">
        <rect x="135" y="142" width="110" height="140" rx="6" fill="#FFFFFF" stroke="#DDE3EC"/>
        <text class="ptag" x="147" y="160">LAB REPORT</text>
        <rect x="147" y="170" width="50" height="4" rx="2" fill="#C9D3E1"/><rect x="205" y="170" width="28" height="4" rx="2" fill="#C9D3E1"/>
        <rect x="147" y="184" width="44" height="4" rx="2" fill="#C9D3E1"/><rect x="205" y="184" width="28" height="4" rx="2" fill="#C9D3E1"/>
        <rect x="147" y="198" width="54" height="4" rx="2" fill="#C9D3E1"/><rect x="205" y="196" width="28" height="8" rx="2" fill="#E23A3A"/>
        <rect x="147" y="212" width="40" height="4" rx="2" fill="#C9D3E1"/><rect x="205" y="212" width="28" height="4" rx="2" fill="#C9D3E1"/>
        <rect x="147" y="226" width="48" height="4" rx="2" fill="#C9D3E1"/><rect x="205" y="226" width="28" height="4" rx="2" fill="#C9D3E1"/>
      </g>
    </g>

    <!-- scanner beam -->
    <g class="scan">
      <rect x="112" y="104" width="156" height="34" fill="url(#beamg)"/>
      <rect x="112" y="136" width="156" height="4" rx="2" fill="#6CFF9C" filter="url(#glow)"/>
    </g>

    <!-- flow into the AI -->
    <path class="flow" d="M276 206 H342" stroke="#6CFF9C" stroke-width="3" stroke-linecap="round" fill="none"/>
    <g class="ai">
      <rect x="350" y="186" width="182" height="40" rx="20" fill="#6CFF9C" filter="url(#glow)"/>
      <text class="aitxt" x="441" y="211" text-anchor="middle">OCR + AI EXTRACTION</text>
    </g>

    <!-- data particles streaming to the timeline -->
    <g filter="url(#glow)">
      <circle r="4" fill="#6CFF9C"><animateMotion dur="1.6s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#m1"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle r="3.5" fill="#F0C265"><animateMotion dur="2s" repeatCount="indefinite" begin="-.7s"><mpath xlink:href="#m2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="-.7s" repeatCount="indefinite"/></circle>
      <circle r="4" fill="#FF6B6B"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-1.2s"><mpath xlink:href="#m3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#FFFFFF"><animateMotion dur="2s" repeatCount="indefinite" begin="-1.5s"><mpath xlink:href="#m2"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2s" begin="-1.5s" repeatCount="indefinite"/></circle>
      <circle r="3" fill="#6CFF9C"><animateMotion dur="2.4s" repeatCount="indefinite" begin="-.3s"><mpath xlink:href="#m3"/></animateMotion><animate attributeName="opacity" values="0;1;1;0" dur="2.4s" begin="-.3s" repeatCount="indefinite"/></circle>
    </g>

    <!-- timeline -->
    <path d="M580 250 H1150" stroke="#2E4B7A" stroke-width="3" stroke-linecap="round"/>
    <circle cx="650" cy="250" r="8" fill="#39A0FF"/>
    <circle cx="860" cy="250" r="8" fill="#39A0FF"/>
    <circle cx="1070" cy="250" r="8" fill="#FF3B3B" filter="url(#glow)"/>
    <text class="date" x="650" y="282" text-anchor="middle">JUN 2021</text>
    <text class="date" x="860" y="282" text-anchor="middle">NOV 2024</text>
    <text class="date" x="1070" y="282" text-anchor="middle">MAR 2026</text>

    <g class="c1">
      <path d="M650 208 V240" stroke="#39A0FF" stroke-width="2" stroke-dasharray="3 4"/>
      <rect x="555" y="116" width="190" height="90" rx="12" fill="#13284D" stroke="#39A0FF" stroke-opacity=".7"/>
      <text class="ck" x="571" y="138">DISCHARGE SUMMARY</text>
      <text class="cv" x="571" y="164">Hypertension</text>
      <text class="cs" x="571" y="186">admitted 3 days</text>
    </g>
    <g class="c2">
      <path d="M860 208 V240" stroke="#39A0FF" stroke-width="2" stroke-dasharray="3 4"/>
      <rect x="765" y="116" width="190" height="90" rx="12" fill="#13284D" stroke="#39A0FF" stroke-opacity=".7"/>
      <text class="ck" x="781" y="138">PRESCRIPTION</text>
      <text class="cv" x="781" y="164">Metformin 500 mg</text>
      <text class="cs" x="781" y="186">BD · read from handwriting</text>
    </g>
    <g class="c3">
      <path d="M1070 208 V240" stroke="#FF3B3B" stroke-width="2" stroke-dasharray="3 4"/>
      <rect x="975" y="116" width="190" height="90" rx="12" fill="#2A0D12" stroke="#FF3B3B"/>
      <text class="ck" x="991" y="138">LAB REPORT</text>
      <text class="cv" x="991" y="164">HbA1c 9.2 %</text>
      <g class="blink">
        <rect x="991" y="174" width="64" height="20" rx="10" fill="#E23A3A"/>
        <text class="bt" x="1023" y="188" text-anchor="middle">▲ HIGH</text>
      </g>
      <text class="cs" x="1064" y="188">ref &lt; 5.7 %</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
</svg>
