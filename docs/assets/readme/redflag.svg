<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t">
  <title id="t">Red-flag triage: chest pain with breathlessness during the call raises an emergency alert and transfers the call to a nurse</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1226"/>
      <stop offset="1" stop-color="#241029"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="card"><rect width="1200" height="330" rx="24"/></clipPath>
    <clipPath id="alertclip"><rect x="812" y="105" width="350" height="190" rx="16"/></clipPath>
  </defs>
  <style>
    .h{font:700 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#FF8A8A}
    .h2{font:600 24px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
    .eq{transform-box:fill-box;transform-origin:center;animation:eq .9s ease-in-out infinite}
    @keyframes eq{0%,100%{transform:scaleY(.2)}50%{transform:scaleY(1)}}
    .blink{animation:blink .8s steps(1) infinite}
    @keyframes blink{0%{opacity:1}50%{opacity:.25}}
    .mono{font:600 12px Consolas,'Courier New',monospace;fill:#9FB0CC}
    .bt{font:600 19px 'Nirmala UI','Segoe UI',sans-serif;fill:#1A1A1A}
    .bs{font:600 11px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px;fill:#6E747C}
    .b1{opacity:0;animation:a4 8s infinite}
    .b2{opacity:0;animation:a16 8s infinite}
    .chip{opacity:0;transform-box:fill-box;transform-origin:center;animation:a28 8s infinite}
    .chipbg{animation:flash 8s infinite}
    .ct{font:800 13px 'Segoe UI',Arial,sans-serif;letter-spacing:.5px;fill:#FFFFFF}
    .arrow{opacity:0;animation:a32 8s infinite}
    .flow{stroke-dasharray:6 8;animation:flow .6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-14}}
    .alert{opacity:0;transform-box:fill-box;transform-origin:center;animation:a34 8s infinite}
    .neon{animation:neon .5s ease-in-out infinite alternate}
    @keyframes neon{from{opacity:.25}to{opacity:.9}}
    .em{font:900 27px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:2px;fill:#FF6B6B}
    .pn{font:700 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
    .pd{font:600 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFB3B3}
    .st{font:600 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
    .s1{opacity:0;animation:a44 8s infinite}
    .s2{opacity:0;animation:a54 8s infinite}
    @keyframes a4{0%,4%{opacity:0;transform:translateY(12px)}8%,94%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
    @keyframes a16{0%,16%{opacity:0;transform:translateY(12px)}20%,94%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}
    @keyframes a28{0%,28%{opacity:0;transform:scale(.6)}32%,94%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
    @keyframes a32{0%,32%{opacity:0}36%,94%{opacity:1}100%{opacity:0}}
    @keyframes a34{0%,34%{opacity:0;transform:scale(.82)}40%,94%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)}}
    @keyframes a44{0%,44%{opacity:0;transform:translateX(-12px)}48%,94%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(0)}}
    @keyframes a54{0%,54%{opacity:0;transform:translateX(-12px)}58%,94%{opacity:1;transform:translateX(0)}100%{opacity:0;transform:translateX(0)}}
    @keyframes flash{0%,32%{fill:#C8860D}35%{fill:#E23A3A}38%{fill:#7A1010}41%{fill:#E23A3A}44%{fill:#7A1010}47%,100%{fill:#E23A3A}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#dots)"/>
    <text class="h" x="60" y="50">RED-FLAG TRIAGE</text>
    <text class="h2" x="60" y="82">Emergencies don't wait in the queue</text>

    <!-- live call panel -->
    <rect x="40" y="105" width="360" height="190" rx="16" fill="#07101F" stroke="#1E3358"/>
    <circle class="blink" cx="64" cy="131" r="6" fill="#FF3B3B"/>
    <text class="mono" x="78" y="135" style="fill:#FF8A8A">LIVE CALL</text>
    <text class="mono" x="384" y="135" text-anchor="end">हिन्दी · 02:41</text>
    <g fill="#4CFF8F">
      <rect class="eq" x="64" y="195" width="7" height="40" rx="3.5" style="animation-delay:-.1s"/>
      <rect class="eq" x="76" y="180" width="7" height="70" rx="3.5" style="animation-delay:-.5s"/>
      <rect class="eq" x="88" y="170" width="7" height="90" rx="3.5" style="animation-delay:-.3s"/>
      <rect class="eq" x="100" y="188" width="7" height="54" rx="3.5" style="animation-delay:-.7s"/>
      <rect class="eq" x="112" y="162" width="7" height="106" rx="3.5" style="animation-delay:-.2s"/>
      <rect class="eq" x="124" y="176" width="7" height="78" rx="3.5" style="animation-delay:-.6s"/>
      <rect class="eq" x="136" y="192" width="7" height="46" rx="3.5" style="animation-delay:-.4s"/>
      <rect class="eq" x="148" y="168" width="7" height="94" rx="3.5" style="animation-delay:-.8s"/>
      <rect class="eq" x="160" y="182" width="7" height="66" rx="3.5" style="animation-delay:-.15s"/>
      <rect class="eq" x="172" y="160" width="7" height="110" rx="3.5" style="animation-delay:-.55s"/>
      <rect class="eq" x="184" y="186" width="7" height="58" rx="3.5" style="animation-delay:-.35s"/>
      <rect class="eq" x="196" y="172" width="7" height="86" rx="3.5" style="animation-delay:-.75s"/>
      <rect class="eq" x="208" y="194" width="7" height="42" rx="3.5" style="animation-delay:-.25s"/>
      <rect class="eq" x="220" y="166" width="7" height="98" rx="3.5" style="animation-delay:-.65s"/>
      <rect class="eq" x="232" y="178" width="7" height="74" rx="3.5" style="animation-delay:-.45s"/>
      <rect class="eq" x="244" y="190" width="7" height="50" rx="3.5" style="animation-delay:-.05s"/>
      <rect class="eq" x="256" y="164" width="7" height="102" rx="3.5" style="animation-delay:-.85s"/>
      <rect class="eq" x="268" y="184" width="7" height="62" rx="3.5" style="animation-delay:-.3s"/>
      <rect class="eq" x="280" y="174" width="7" height="82" rx="3.5" style="animation-delay:-.6s"/>
      <rect class="eq" x="292" y="196" width="7" height="38" rx="3.5" style="animation-delay:-.2s"/>
      <rect class="eq" x="304" y="170" width="7" height="90" rx="3.5" style="animation-delay:-.7s"/>
      <rect class="eq" x="316" y="186" width="7" height="58" rx="3.5" style="animation-delay:-.4s"/>
      <rect class="eq" x="328" y="178" width="7" height="74" rx="3.5" style="animation-delay:-.1s"/>
      <rect class="eq" x="340" y="192" width="7" height="46" rx="3.5" style="animation-delay:-.5s"/>
      <rect class="eq" x="352" y="182" width="7" height="66" rx="3.5" style="animation-delay:-.8s"/>
      <rect class="eq" x="364" y="198" width="7" height="34" rx="3.5" style="animation-delay:-.35s"/>
    </g>
    <text class="mono" x="64" y="280">patient speaking · AI listening</text>

    <!-- what the patient says -->
    <g class="b1">
      <rect x="440" y="110" width="300" height="58" rx="14" fill="#FFFFFF"/>
      <text class="bt" x="458" y="138">सीने में दर्द है…</text>
      <text class="bs" x="458" y="156">"CHEST PAIN…"</text>
    </g>
    <g class="b2">
      <rect x="440" y="178" width="300" height="58" rx="14" fill="#FFFFFF"/>
      <text class="bt" x="458" y="206">…और साँस फूल रही है</text>
      <text class="bs" x="458" y="224">"…AND I'M BREATHLESS"</text>
    </g>
    <g class="chip">
      <rect class="chipbg" x="440" y="248" width="300" height="40" rx="20" fill="#C8860D"/>
      <text class="ct" x="590" y="273" text-anchor="middle">RULE RF-CARD-01 MATCHED</text>
    </g>

    <!-- arrow -->
    <g class="arrow">
      <path class="flow" d="M752 200 H796" stroke="#FF6B6B" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M796 190 l14 10 l-14 10 z" fill="#FF6B6B"/>
    </g>

    <!-- triage alert card -->
    <g class="alert">
      <rect class="neon" x="812" y="105" width="350" height="190" rx="16" fill="none" stroke="#FF3B3B" stroke-width="10" filter="url(#soft)"/>
      <rect x="812" y="105" width="350" height="190" rx="16" fill="#2A0D12" stroke="#E23A3A" stroke-width="2"/>
      <g clip-path="url(#alertclip)">
        <g filter="url(#soft)">
          <animateTransform attributeName="transform" type="rotate" from="0 866 156" to="360 866 156" dur="1s" repeatCount="indefinite"/>
          <path d="M866 156 L1010 106 L1010 206 Z" fill="#FF3B3B" opacity=".45"/>
          <path d="M866 156 L722 106 L722 206 Z" fill="#FF3B3B" opacity=".3"/>
        </g>
        <circle cx="866" cy="156" r="20" fill="none" stroke="#FF6B6B" stroke-width="2" opacity="0">
          <animate attributeName="r" values="20;90" dur="1.2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".8;0" dur="1.2s" repeatCount="indefinite"/>
        </circle>
      </g>
      <rect x="846" y="164" width="40" height="10" rx="3" fill="#9AA7BD"/>
      <path d="M850 164 a16 16 0 0 1 32 0 z" fill="#FF3B3B" filter="url(#glow)"/>
      <text class="em blink" x="900" y="168">EMERGENCY</text>
      <text class="pn" x="836" y="210">Ramesh K · 45 M · OPD-217</text>
      <text class="pd" x="836" y="232">chest pain + breathlessness</text>
      <g class="s1">
        <circle cx="846" cy="258" r="9" fill="#2E9E4F"/>
        <path d="M841.5 258 l3 3 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="st" x="862" y="263">Triage nurse alerted</text>
      </g>
      <g class="s2">
        <circle cx="846" cy="282" r="9" fill="#2E9E4F"/>
        <path d="M841.5 282 l3 3 l6 -6" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="st" x="862" y="287">Call transferred to the nurse</text>
      </g>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
</svg>
