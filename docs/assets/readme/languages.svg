<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="t">
  <title id="t">MediKiosk speaks the patient's language: Indian languages orbiting a microphone</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1630"/>
      <stop offset="1" stop-color="#1A3563"/>
    </linearGradient>
    <radialGradient id="coreg" cx=".4" cy=".35" r=".8">
      <stop offset="0" stop-color="#FFB25C"/>
      <stop offset=".55" stop-color="#FF9933"/>
      <stop offset="1" stop-color="#C8620D"/>
    </radialGradient>
    <linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset=".35" stop-color="#FFD39B"/>
      <stop offset=".65" stop-color="#9FF5BC"/>
      <stop offset="1" stop-color="#FFFFFF"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="520 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="440" rx="24"/></clipPath>
  </defs>
  <style>
    .pl{font:700 15px 'Nirmala UI','Noto Sans','Segoe UI',sans-serif;fill:#FFFFFF}
    .ov{font:700 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#F0C265}
    .gr{font:800 64px 'Nirmala UI','Noto Sans','Segoe UI',sans-serif;opacity:0;animation:cyc 11s infinite}
    @keyframes cyc{0%{opacity:0;transform:translateY(18px)}1.5%{opacity:1;transform:translateY(0)}7.5%{opacity:1;transform:translateY(0)}9%{opacity:0;transform:translateY(-18px)}100%{opacity:0;transform:translateY(-18px)}}
    .l1{font:500 21px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#DCE6F5}
    .l2{font:500 16px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9FB0CC}
    .chip{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.6,.4,1) forwards}
    @keyframes pop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
    .ct{font:600 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
    .sat{animation:tw 1.6s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.35}50%{opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="url(#bg)"/>
    <rect width="1200" height="440" fill="url(#dots)"/>

    <!-- orbits -->
    <circle cx="300" cy="220" r="112" fill="none" stroke="#35568C" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="300" cy="220" r="170" fill="none" stroke="#2C4A7A" stroke-width="1.5" stroke-dasharray="4 7"/>
    <circle cx="300" cy="220" r="208" fill="none" stroke="#24406E" stroke-width="1.2" stroke-dasharray="2 9"/>

    <!-- outer satellites -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 300 220" to="360 300 220" dur="48s" repeatCount="indefinite"/>
      <circle class="sat" cx="508" cy="220" r="4.5" fill="#F0C265" filter="url(#glow)" style="animation-delay:0s"/>
      <circle class="sat" cx="404" cy="400" r="4" fill="#8FE0A8" filter="url(#glow)" style="animation-delay:-.4s"/>
      <circle class="sat" cx="196" cy="400" r="4.5" fill="#FF9933" filter="url(#glow)" style="animation-delay:-.8s"/>
      <circle class="sat" cx="92" cy="220" r="4" fill="#FFFFFF" filter="url(#glow)" style="animation-delay:-1.2s"/>
      <circle class="sat" cx="196" cy="40" r="4.5" fill="#8FE0A8" filter="url(#glow)" style="animation-delay:-.6s"/>
      <circle class="sat" cx="404" cy="40" r="4" fill="#F0C265" filter="url(#glow)" style="animation-delay:-1s"/>
    </g>

    <!-- ring 2 (counter-clockwise) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 300 220" to="-360 300 220" dur="38s" repeatCount="indefinite"/>
      <g transform="translate(447 305)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#6B3FA0"/><text class="pl" x="0" y="5.5" text-anchor="middle">বাংলা</text></g></g>
      <g transform="translate(300 390)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#E23A3A"/><text class="pl" x="0" y="5.5" text-anchor="middle">मराठी</text></g></g>
      <g transform="translate(153 305)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#2E5C8A"/><text class="pl" x="0" y="5.5" text-anchor="middle">ಕನ್ನಡ</text></g></g>
      <g transform="translate(153 135)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#3A9A3A"/><text class="pl" x="0" y="5.5" text-anchor="middle">മലയാളം</text></g></g>
      <g transform="translate(300 50)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#D9822B"/><text class="pl" x="0" y="5.5" text-anchor="middle">ગુજરાતી</text></g></g>
      <g transform="translate(447 135)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="38s" repeatCount="indefinite"/>
        <rect x="-46" y="-16" width="92" height="32" rx="16" fill="#1F8A8A"/><text class="pl" x="0" y="5.5" text-anchor="middle">ଓଡ଼ିଆ</text></g></g>
    </g>

    <!-- ring 1 (clockwise) -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 300 220" to="360 300 220" dur="26s" repeatCount="indefinite"/>
      <g transform="translate(412 220)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#FF9933"/><text class="pl" x="0" y="5.5" text-anchor="middle">हिन्दी</text></g></g>
      <g transform="translate(300 332)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#2E9E4F"/><text class="pl" x="0" y="5.5" text-anchor="middle">తెలుగు</text></g></g>
      <g transform="translate(188 220)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#0070C0"/><text class="pl" x="0" y="5.5" text-anchor="middle">English</text></g></g>
      <g transform="translate(300 108)"><g><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="26s" repeatCount="indefinite"/>
        <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#C8860D"/><text class="pl" x="0" y="5.5" text-anchor="middle">தமிழ்</text></g></g>
    </g>

    <!-- pulsing core with microphone -->
    <circle cx="300" cy="220" r="64" fill="none" stroke="#FF9933" stroke-width="3" opacity="0">
      <animate attributeName="r" values="64;104" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".7;0" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="220" r="64" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0">
      <animate attributeName="r" values="64;104" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".5;0" dur="2.4s" begin="1.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="220" r="64" fill="url(#coreg)" filter="url(#glow)"/>
    <g transform="translate(300 214)">
      <rect x="-10" y="-26" width="20" height="34" rx="10" fill="#FFFFFF"/>
      <path d="M-19 -2 a19 19 0 0 0 38 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
      <path d="M0 17 v10 M-11 29 h22" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- right side copy -->
    <text class="ov" x="640" y="104">SPEAKS THE PATIENT'S LANGUAGE</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:0s">नमस्ते</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:1s">నమస్కారం</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:2s">வணக்கம்</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:3s">নমস্কার</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:4s">नमस्कार</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:5s">ನಮಸ್ಕಾರ</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:6s">നമസ്കാരം</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:7s">નમસ્તે</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:8s">ନମସ୍କାର</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:9s">ਸਤ ਸ੍ਰੀ ਅਕਾਲ</text>
    <text class="gr" x="636" y="196" fill="url(#shine)" style="animation-delay:10s">Hello</text>
    <text class="l1" x="640" y="256">Understands 22 Indian languages,</text>
    <text class="l1" x="640" y="286">even when they are mixed with English.</text>
    <text class="l2" x="640" y="322">Hindi · Telugu · English in the MVP. No app, no typing, no reading.</text>

    <g class="chip" style="animation-delay:.4s">
      <rect x="640" y="346" width="160" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#8FE0A8" stroke-opacity=".8"/>
      <text class="ct" x="720" y="368" text-anchor="middle">8 kHz phone audio</text>
    </g>
    <g class="chip" style="animation-delay:.6s">
      <rect x="812" y="346" width="148" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#F0C265" stroke-opacity=".8"/>
      <text class="ct" x="886" y="368" text-anchor="middle">keypad fallback</text>
    </g>
    <g class="chip" style="animation-delay:.8s">
      <rect x="972" y="346" width="178" height="34" rx="17" fill="#FFFFFF" fill-opacity=".07" stroke="#FF9933" stroke-opacity=".8"/>
      <text class="ct" x="1061" y="368" text-anchor="middle">read-back to confirm</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="438" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
</svg>
