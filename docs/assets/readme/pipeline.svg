<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="t">
  <title id="t">How MediKiosk works: AI call, case-taking, red-flag check, documents, doctor summary</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081328"/>
      <stop offset="1" stop-color="#16305A"/>
    </linearGradient>
    <radialGradient id="hl" cx=".35" cy=".3" r=".75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".38"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#FFFFFF" fill-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="card"><rect width="1200" height="330" rx="24"/></clipPath>
    <path id="wave" d="M130 175 C 208 95, 287 95, 365 175 S 522 255, 600 175 S 757 95, 835 175 S 992 255, 1070 175"/>
  </defs>
  <style>
    .h{font:700 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:3px;fill:#F0C265}
    .h2{font:600 24px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#FFFFFF}
    .flow{stroke-dasharray:2 16;animation:flow 1.1s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-18}}
    .ring{fill:none;stroke-width:3;opacity:0;transform-box:fill-box;transform-origin:center;animation:ping 6s ease-out infinite}
    @keyframes ping{0%{opacity:.95;transform:scale(1)}18%{opacity:0;transform:scale(1.75)}100%{opacity:0;transform:scale(1.75)}}
    .core{transform-box:fill-box;transform-origin:center;animation:beat 6s ease-in-out infinite}
    @keyframes beat{0%{transform:scale(1.14)}10%{transform:scale(1)}100%{transform:scale(1)}}
    .lbl{font:800 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif;letter-spacing:1px;fill:#FFFFFF}
    .sl{font:500 13px 'Segoe UI','Helvetica Neue',Arial,sans-serif;fill:#9FB0CC}
    .num{font:800 12px 'Segoe UI',Arial,sans-serif;fill:#0A1630}
    .dot{animation:typing 1.2s ease-in-out infinite}
    @keyframes typing{0%,100%{opacity:.25}50%{opacity:1}}
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#dots)"/>
    <text class="h" x="60" y="50">HOW IT WORKS</text>
    <text class="h2" x="60" y="82">From one phone call to a doctor-ready summary</text>

    <path d="M130 175 C 208 95, 287 95, 365 175 S 522 255, 600 175 S 757 95, 835 175 S 992 255, 1070 175" fill="none" stroke="#24406E" stroke-width="7" stroke-linecap="round"/>
    <path class="flow" d="M130 175 C 208 95, 287 95, 365 175 S 522 255, 600 175 S 757 95, 835 175 S 992 255, 1070 175" fill="none" stroke="#F0C265" stroke-width="3" stroke-linecap="round"/>

    <!-- 1 AI call -->
    <g transform="translate(130 175)">
      <circle class="ring" r="46" stroke="#39A0FF" style="animation-delay:0s"/>
      <g class="core" style="animation-delay:0s">
        <circle r="46" fill="#0070C0" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3"/>
        <circle r="46" fill="url(#hl)"/>
        <g transform="translate(-18 -18) scale(1.5)">
          <path d="M6.62 10.79a15.05 15.05 0 0 0 6.59 6.59l2.2-2.2a1 1 0 0 1 1.02-.24c1.12.37 2.33.57 3.57.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1.02l-2.2 2.2z" fill="#FFFFFF"/>
        </g>
      </g>
      <circle cx="34" cy="-34" r="12" fill="#F0C265"/>
      <text class="num" x="34" y="-30" text-anchor="middle">1</text>
    </g>

    <!-- 2 case-taking -->
    <g transform="translate(365 175)">
      <circle class="ring" r="46" stroke="#6FA8E0" style="animation-delay:1.5s"/>
      <g class="core" style="animation-delay:1.5s">
        <circle r="46" fill="#2E5C8A" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3"/>
        <circle r="46" fill="url(#hl)"/>
        <rect x="-19" y="-15" width="38" height="26" rx="9" fill="#FFFFFF"/>
        <path d="M-9 10 l-5 10 l13 -10 z" fill="#FFFFFF"/>
        <circle class="dot" cx="-9" cy="-2" r="3.2" fill="#2E5C8A" style="animation-delay:0s"/>
        <circle class="dot" cx="0" cy="-2" r="3.2" fill="#2E5C8A" style="animation-delay:.2s"/>
        <circle class="dot" cx="9" cy="-2" r="3.2" fill="#2E5C8A" style="animation-delay:.4s"/>
      </g>
      <circle cx="34" cy="-34" r="12" fill="#F0C265"/>
      <text class="num" x="34" y="-30" text-anchor="middle">2</text>
    </g>

    <!-- 3 red-flag check -->
    <g transform="translate(600 175)">
      <circle class="ring" r="46" stroke="#FF6B6B" style="animation-delay:3s"/>
      <g class="core" style="animation-delay:3s">
        <circle r="46" fill="#E23A3A" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3"/>
        <circle r="46" fill="url(#hl)"/>
        <path d="M0 -21 L17 -14 V0 C17 11 9 18 0 22 C-9 18 -17 11 -17 0 V-14 Z" fill="#FFFFFF"/>
        <rect x="-2.6" y="-11" width="5.2" height="14" rx="2.2" fill="#E23A3A"/>
        <circle cx="0" cy="9" r="3.1" fill="#E23A3A"/>
      </g>
      <circle cx="34" cy="-34" r="12" fill="#F0C265"/>
      <text class="num" x="34" y="-30" text-anchor="middle">3</text>
    </g>

    <!-- 4 documents -->
    <g transform="translate(835 175)">
      <circle class="ring" r="46" stroke="#F0B24A" style="animation-delay:4.5s"/>
      <g class="core" style="animation-delay:4.5s">
        <circle r="46" fill="#C8860D" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3"/>
        <circle r="46" fill="url(#hl)"/>
        <path d="M-14 -19 H6 L15 -10 V19 H-14 Z" fill="#FFFFFF"/>
        <path d="M6 -19 V-10 H15" fill="none" stroke="#C8860D" stroke-width="2"/>
        <rect x="-8" y="-4" width="17" height="3.4" rx="1.7" fill="#C8860D"/>
        <rect x="-8" y="3" width="17" height="3.4" rx="1.7" fill="#C8860D"/>
        <rect x="-8" y="10" width="11" height="3.4" rx="1.7" fill="#C8860D"/>
      </g>
      <circle cx="34" cy="-34" r="12" fill="#F0C265"/>
      <text class="num" x="34" y="-30" text-anchor="middle">4</text>
    </g>

    <!-- 5 doctor summary -->
    <g transform="translate(1070 175)">
      <circle class="ring" r="46" stroke="#5FE08A" style="animation-delay:5.9s"/>
      <g class="core" style="animation-delay:5.9s">
        <circle r="46" fill="#2E9E4F" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="3"/>
        <circle r="46" fill="url(#hl)"/>
        <rect x="-15" y="-17" width="30" height="36" rx="5" fill="#FFFFFF"/>
        <rect x="-8" y="-22" width="16" height="9" rx="3" fill="#1B5E32"/>
        <path d="M-8 2 l6 6 l11 -12" fill="none" stroke="#2E9E4F" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <circle cx="34" cy="-34" r="12" fill="#F0C265"/>
      <text class="num" x="34" y="-30" text-anchor="middle">5</text>
    </g>

    <!-- travelling comet -->
    <g filter="url(#glow)">
      <circle r="3" fill="#FFE3B8" opacity=".3"><animateMotion dur="6s" repeatCount="indefinite" begin="-5.64s"><mpath xlink:href="#wave"/></animateMotion></circle>
      <circle r="4.5" fill="#FFE3B8" opacity=".45"><animateMotion dur="6s" repeatCount="indefinite" begin="-5.76s"><mpath xlink:href="#wave"/></animateMotion></circle>
      <circle r="6" fill="#FFFFFF" opacity=".65"><animateMotion dur="6s" repeatCount="indefinite" begin="-5.88s"><mpath xlink:href="#wave"/></animateMotion></circle>
      <circle r="8.5" fill="#FFFFFF"><animateMotion dur="6s" repeatCount="indefinite"><mpath xlink:href="#wave"/></animateMotion></circle>
    </g>

    <text class="lbl" x="130" y="256" text-anchor="middle">AI CALL</text>
    <text class="sl" x="130" y="277" text-anchor="middle">any phone, own language</text>
    <text class="lbl" x="365" y="256" text-anchor="middle">CASE-TAKING</text>
    <text class="sl" x="365" y="277" text-anchor="middle">doctor-style questions</text>
    <text class="lbl" x="600" y="256" text-anchor="middle">RED-FLAG CHECK</text>
    <text class="sl" x="600" y="277" text-anchor="middle">after every answer</text>
    <text class="lbl" x="835" y="256" text-anchor="middle">DOCUMENTS</text>
    <text class="sl" x="835" y="277" text-anchor="middle">old papers → timeline</text>
    <text class="lbl" x="1070" y="256" text-anchor="middle">DOCTOR SUMMARY</text>
    <text class="sl" x="1070" y="277" text-anchor="middle">read in 30 s, confirm</text>
  </g>
  <rect x="1" y="1" width="1198" height="328" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>
</svg>
